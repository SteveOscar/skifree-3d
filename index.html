    <style>
:root {
  --snow: #f4f7fc;
  --fog: #dde7f3;
  --ink: #1b2a44;
  --label: #5a6b86;
  --player: #ff4424;
  --accent: #ffc93c;
  --gate-red: #e0322a;
  --gate-blue: #1f5fe0;
  --panel: rgba(255, 255, 255, 0.72);
  --panel-border: rgba(27, 42, 68, 0.25);
  --font-hud: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --font-title: ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
}

html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--fog);
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}

/* Stacking: canvas (0) < vignette (1) < DOM UI (2). The renderer prepends its canvas to <body>. */
canvas {
  display: block;
  position: fixed;
  inset: 0;
  z-index: 0;
  outline: none;
}

/* Cool, slightly darker corners focus the eye on the lane (look-dev: a CSS overlay, not a post pass). */
#vignette {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: radial-gradient(ellipse 75% 70% at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(24, 44, 84, 0.2) 100%);
}

/* Container for all DOM UI. Children opt back into pointer events. */
#ui {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  color: var(--ink);
  font-family: var(--font-hud);
}

body.no-hud #ui {
  display: none;
}

    <style>
/* SkiFree 3D — DOM UI (§1.5, §3.9): HUD, toasts, comic pops, yeti indicator, hints and screens.
   Everything lives in #ui (pointer-events: none); interactive children opt back in. Variables come from main.css. */

:root {
  --sign-board: #ffc93c;
  --sign-slalom: #39d0ff;
  --sign-freestyle: #2fbf5b;
  --sign-tree: #ffc93c;
  --good: #2fbf5b;
  --bad: #e0322a;
  --danger: #ff2a1a;
  --stroke: #1b2a44;
  --card: rgba(255, 255, 255, 0.9);
  --shadow-1: 0 1px 2px rgba(27, 42, 68, 0.1), 0 6px 18px rgba(27, 42, 68, 0.12);
  --shadow-2: 0 2px 6px rgba(27, 42, 68, 0.1), 0 22px 60px rgba(27, 42, 68, 0.24);
  --ease-pop: cubic-bezier(0.2, 1.5, 0.4, 1);
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
}

#ui {
  -webkit-font-smoothing: antialiased;
}

/* Zero-specificity reset so component classes (.btn, .sign, .hud-btn) style buttons without fighting an id. */
:where(#ui) button {
  font: inherit;
  color: inherit;
  margin: 0;
  -webkit-tap-highlight-color: transparent;
}

#ui kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  min-width: 1.8em;
  height: 1.8em;
  padding: 0 0.45em;
  border-radius: 6px;
  background: #fff;
  border: 1px solid rgba(27, 42, 68, 0.22);
  border-bottom-width: 2px;
  color: var(--ink);
  font: 700 11px/1 var(--font-hud);
  letter-spacing: 0;
  text-transform: none;
  vertical-align: middle;
}

#ui kbd.kbd-arrow {
  font: 700 14px/1 system-ui, sans-serif;
}

#ui .icon {
  width: 18px;
  height: 18px;
  flex: none;
}

/* ---------------------------------------------------------------- HUD */

.hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.hud[data-mode='title'] {
  display: none;
}

.hud[data-mode='gameover'] .hud-tr,
.hud[data-mode='gameover'] .hud-tl,
.hud[data-mode='gameover'] .toasts,
.hud[data-mode='eaten'] .hud-tl {
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.4s, visibility 0s 0.4s;
}

.hud-tr {
  position: absolute;
  top: 16px;
  right: 16px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}

.hud-panel {
  box-sizing: border-box;
  min-width: 204px;
  padding: 9px 14px 10px;
  background: var(--panel);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  box-shadow: var(--shadow-1);
  font: 500 14px/1.55 var(--font-hud);
  font-variant-numeric: tabular-nums;
}

.hud-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 22px;
}

.hud-label {
  color: var(--label);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.hud-value {
  display: inline-block;
  color: var(--ink);
  font-size: 15.5px;
  font-weight: 700;
  transform-origin: 100% 60%;
}

.hud-unit {
  margin-left: 1px;
  color: var(--label);
  font-size: 12px;
  font-weight: 600;
}

.hud-row.is-up .hud-value {
  animation: hud-flash-up 0.7s var(--ease-out);
}

.hud-row.is-down .hud-value {
  animation: hud-flash-down 0.7s var(--ease-out);
}

@keyframes hud-flash-up {
  0% {
    color: var(--good);
    transform: scale(1.28);
  }
  100% {
    color: var(--ink);
    transform: scale(1);
  }
}

@keyframes hud-flash-down {
  0% {
    color: var(--bad);
    transform: scale(1.28);
  }
  100% {
    color: var(--ink);
    transform: scale(1);
  }
}

/* Mode line above the panel: a pill with the course's sign colour. */
.hud-mode {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 11px 4px 9px;
  background: var(--panel);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border: 1px solid var(--panel-border);
  border-radius: 999px;
  box-shadow: var(--shadow-1);
  color: var(--ink);
  font: 800 12px/1.2 var(--font-hud);
  letter-spacing: 0.08em;
  white-space: nowrap;
}

.hud-mode.is-empty {
  display: none;
}

.hud-mode-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: var(--label);
  box-shadow: 0 0 0 1.5px var(--ink);
}

.hud-mode[data-course='slalom'] .hud-mode-dot {
  background: var(--sign-slalom);
}

.hud-mode[data-course='treeSlalom'] .hud-mode-dot {
  background: var(--sign-tree);
}

.hud-mode[data-course='freestyle'] .hud-mode-dot {
  background: var(--sign-freestyle);
}

.hud-badges {
  display: flex;
  gap: 6px;
}

.hud-turbo {
  display: none;
  align-items: center;
  gap: 4px;
  padding: 3px 10px 3px 7px;
  border-radius: 999px;
  background: var(--accent);
  border: 1px solid rgba(27, 42, 68, 0.35);
  box-shadow: var(--shadow-1);
  color: var(--ink);
  font: 800 12px/1.2 var(--font-hud);
  letter-spacing: 0.16em;
}

.hud-turbo.is-on {
  display: flex;
  animation: badge-in 0.25s var(--ease-pop);
}

#ui .hud-turbo .icon {
  width: 14px;
  height: 14px;
}

@keyframes badge-in {
  from {
    transform: scale(0.4);
    opacity: 0;
  }
}

/* Top-left: pause and mute (touch-size on coarse pointers). */
.hud-tl {
  position: absolute;
  top: 16px;
  left: 16px;
  display: flex;
  gap: 8px;
}

.hud-btn {
  pointer-events: auto;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border-radius: 12px;
  background: var(--panel);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border: 1px solid var(--panel-border);
  box-shadow: var(--shadow-1);
  color: var(--ink);
  cursor: pointer;
  transition: transform 0.1s, background 0.15s;
}

.hud-btn:hover {
  background: rgba(255, 255, 255, 0.92);
}

.hud-btn:active {
  transform: scale(0.93);
}

.hud-btn:focus-visible {
  outline: 3px solid rgba(31, 95, 224, 0.55);
  outline-offset: 2px;
}

#ui .hud-btn .icon {
  width: 20px;
  height: 20px;
}

.hud-btn.is-off {
  color: var(--label);
}

.hud.is-touch .hud-btn {
  width: 52px;
  height: 52px;
  border-radius: 16px;
}

#ui .hud.is-touch .hud-btn .icon {
  width: 24px;
  height: 24px;
}

.hud.is-paused .hud-tl {
  opacity: 0;
}

/* ---------------------------------------------------------------- toasts (top-centre) */

/* High enough to clear the skier even at full pull-back (skier at ~20 % from the top); drops below the yeti chevron
   while that is shown. At most two (pops.js), the older one reduced to its title, so the stack stays within ~14vh. */
.toasts {
  position: absolute;
  top: 5%;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 90vw;
  text-align: center;
  transition: top 0.25s var(--ease-out);
}

.hud.has-yeti .toasts {
  top: 10.5%;
}

.toast {
  animation: toast-in 0.18s var(--ease-pop) both;
}

.toast.is-leaving {
  animation: toast-out 0.35s ease-in forwards;
}

.toast-title,
.toast-sub,
.pop-text {
  color: #fff;
  /* 6 px painted under the fill leaves a 3 px outline (§3.9). */
  -webkit-text-stroke: 6px var(--stroke);
  paint-order: stroke fill;
}

.toast-title {
  font: 800 36px/1.08 var(--font-title);
  letter-spacing: 0.005em;
  text-shadow: 0 4px 0 rgba(27, 42, 68, 0.22);
}

.toast:nth-child(n + 2) .toast-title {
  font-size: 24px;
}

.toast:nth-child(n + 2) {
  opacity: 0.85;
}

.toast-sub {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-top: 2px;
  font: 800 21px/1.1 var(--font-title);
  text-shadow: 0 3px 0 rgba(27, 42, 68, 0.2);
}

.toast:nth-child(n + 2) .toast-sub {
  display: none;
}

/* During a chase the stack starts lower (under the chevron): the newest toast alone keeps clear of the skier. */
.hud.has-yeti .toast:nth-child(n + 2) {
  display: none;
}

.toast-points {
  color: var(--accent);
}

.toast--turbo .toast-title {
  color: var(--accent);
}

.toast-practice {
  padding: 3px 9px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.88);
  border: 1px solid var(--panel-border);
  color: var(--label);
  -webkit-text-stroke: 0;
  text-shadow: none;
  font: 800 10.5px/1.2 var(--font-hud);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

@keyframes toast-in {
  from {
    transform: scale(0.35);
    opacity: 0;
  }
}

@keyframes toast-out {
  to {
    transform: translateY(-10px) scale(0.92);
    opacity: 0;
  }
}

/* ---------------------------------------------------------------- world-anchored comic pops */

.pops {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.pop {
  position: absolute;
  left: 0;
  top: 0;
  will-change: transform;
}

.pop-in {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transform: translate(-50%, -100%);
}

.pop-text {
  display: inline-block;
  font: 800 24px/1 var(--font-title);
  text-shadow: 0 3px 0 rgba(27, 42, 68, 0.22);
  animation: pop-scale 0.18s var(--ease-pop) both;
}

@keyframes pop-scale {
  from {
    transform: scale(0.2);
  }
}

.pop--ouch .pop-text {
  font-size: 32px;
  rotate: -7deg;
}

.pop--woof .pop-text {
  font-size: 22px;
  rotate: 6deg;
}

.pop--good .pop-text,
.pop--bad .pop-text {
  font-size: 21px;
}

.pop--bad .pop-text {
  color: #ff6a55;
}

.pop--big .pop-text {
  font-size: 36px;
  color: var(--accent);
}

.pop--roar .pop-text {
  font-size: 34px;
  color: #ffd9d3;
  rotate: -5deg;
}

.pop--chomp .pop-text {
  font-size: 46px;
  color: #ff5a3c;
  rotate: -6deg;
  text-shadow: 0 4px 0 rgba(27, 42, 68, 0.25);
}

.pop--fire .pop-text {
  font-size: 30px;
  color: var(--accent);
  rotate: 4deg;
}

.pop--miss .pop-text {
  font-size: 22px;
}

.pop-badge {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 3px solid var(--stroke);
  color: #fff;
  box-shadow: 0 3px 0 rgba(27, 42, 68, 0.25);
  animation: pop-scale 0.18s var(--ease-pop) both;
}

#ui .pop-badge .icon {
  width: 17px;
  height: 17px;
}

.pop--pass .pop-badge {
  background: var(--good);
}

.pop--miss .pop-badge {
  background: var(--bad);
}

/* ---------------------------------------------------------------- yeti indicator, danger glow, hints */

.hud-yeti-glow {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 24vh;
  background: linear-gradient(to bottom, rgba(255, 42, 26, 0.3), rgba(255, 42, 26, 0.08) 45%, rgba(255, 42, 26, 0));
  opacity: 0;
  transition: opacity 0.35s;
}

.hud-yeti {
  position: absolute;
  top: 0;
  left: 0;
  width: 64px;
  margin-left: -32px;
  display: flex;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
}

.hud-yeti.is-on {
  opacity: 1;
}

/* A red tab hanging from the top edge (the yeti is uphill, behind you): two chevrons over the distance. */
.hud-yeti-tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding: 5px 9px 7px;
  border: 2px solid #fff;
  border-top: none;
  border-radius: 0 0 14px 14px;
  background: linear-gradient(to bottom, #ff4a2e, #d9180f);
  box-shadow: 0 4px 12px rgba(94, 15, 28, 0.35), 0 0 0 1px rgba(94, 15, 28, 0.25);
  color: #fff;
  transform-origin: 50% 0;
}

#ui .hud-yeti-chevron {
  width: 22px;
  height: 20px;
  overflow: visible;
}

#ui .hud-yeti-chevron .chev-far {
  animation: chev-pulse 0.9s ease-in-out infinite;
}

#ui .hud-yeti-chevron .chev-near {
  animation: chev-pulse 0.9s 0.45s ease-in-out infinite;
}

.hud-yeti-dist {
  font: 800 13px/1.1 var(--font-hud);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  white-space: nowrap;
}

.hud-yeti.is-close .hud-yeti-tab {
  animation: yeti-throb 0.42s ease-in-out infinite alternate;
}

#ui .hud-yeti.is-close .chev {
  animation-duration: 0.42s;
}

.hud-yeti.is-below {
  top: auto;
  bottom: 0;
}

.hud-yeti.is-below .hud-yeti-tab {
  flex-direction: column-reverse;
  border: 2px solid #fff;
  border-bottom: none;
  border-radius: 14px 14px 0 0;
  transform-origin: 50% 100%;
}

.hud-yeti.is-below .hud-yeti-chevron {
  rotate: 180deg;
}

/* Narrow screens: dropped below the HUD corners (hud.js _yetiRange), a floating pill with the chevrons beside the
   distance, so it keeps the yeti's side without a tall tab over the skier's band. */
.hud-yeti.is-dropped .hud-yeti-tab {
  flex-direction: row;
  gap: 5px;
  padding: 4px 11px 4px 8px;
  border: 2px solid #fff;
  border-radius: 999px;
  transform-origin: 50% 50%;
}

#ui .hud-yeti.is-dropped .hud-yeti-chevron {
  width: 18px;
  height: 16px;
}

@keyframes chev-pulse {
  0%,
  100% {
    opacity: 0.45;
  }
  50% {
    opacity: 1;
  }
}

@keyframes yeti-throb {
  to {
    transform: scale(1.1);
    box-shadow: 0 6px 18px rgba(255, 42, 26, 0.55), 0 0 0 1px rgba(94, 15, 28, 0.25);
  }
}

.hud-hint {
  position: absolute;
  left: 0;
  top: 0;
  opacity: 0;
  transition: opacity 0.3s;
}

.hud-hint.is-on {
  opacity: 1;
}

.hud-hint-text {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  translate: -50% 0;
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.88);
  border: 1px solid var(--panel-border);
  box-shadow: var(--shadow-1);
  color: var(--ink);
  font: 700 14px/1.2 var(--font-title);
  white-space: nowrap;
  animation: hint-bob 1.8s ease-in-out infinite;
}

@keyframes hint-bob {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(4px);
  }
}

/* ---------------------------------------------------------------- screens: shared */

.screen {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.screen-backdrop {
  position: absolute;
  inset: 0;
  pointer-events: auto;
  background: radial-gradient(ellipse at 50% 45%, rgba(27, 42, 68, 0.2), rgba(27, 42, 68, 0.42));
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  animation: fade-in 0.2s ease-out both;
}

.card {
  pointer-events: auto;
  position: absolute;
  box-sizing: border-box;
  background: var(--card);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.95);
  border-radius: 20px;
  box-shadow: 0 0 0 1px rgba(27, 42, 68, 0.14), var(--shadow-2);
  color: var(--ink);
  font-family: var(--font-title);
}

.card-title {
  margin: 0;
  font: 800 30px/1.1 var(--font-title);
  letter-spacing: -0.01em;
}

.card-sub {
  margin: 4px 0 18px;
  color: var(--label);
  font-size: 14px;
}

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
}

.screen-pause .card,
.screen-help .card,
.screen-scores .card {
  left: 50%;
  top: 50%;
  translate: -50% -50%;
  animation: card-in 0.28s var(--ease-pop) both;
}

/* body has touch-action: none (main.css); scrollable cards opt back in so a finger can scroll a tall panel. */
.help-card,
.scores-card,
.pause-card {
  touch-action: pan-y;
}

/* Controls / High Scores opened from another screen replace it visually instead of stacking a second card on it. */
#ui:has(> .screen-help, > .screen-scores) > .screen-pause,
#ui:has(> .screen-help, > .screen-scores) > :is(.screen-title, .screen-gameover) > :is(.card, .title-head, .title-foot) {
  visibility: hidden;
}

@keyframes card-in {
  from {
    scale: 0.94;
    opacity: 0;
  }
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
}

/* Buttons */
.btn {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  box-sizing: border-box;
  height: 42px;
  padding: 0 16px;
  border-radius: 12px;
  border: 1px solid var(--panel-border);
  background: #fff;
  box-shadow: 0 1px 0 rgba(27, 42, 68, 0.1);
  color: var(--ink);
  font: 700 15px/1 var(--font-title);
  white-space: nowrap;
  cursor: pointer;
  transition: transform 0.1s, background 0.15s, border-color 0.15s, box-shadow 0.15s;
}

.btn:hover {
  background: #f4f7fc;
  border-color: rgba(27, 42, 68, 0.38);
}

.btn:active {
  transform: translateY(1px) scale(0.98);
}

.btn:focus-visible,
.sign:focus-visible {
  outline: 3px solid rgba(31, 95, 224, 0.6);
  outline-offset: 3px;
}

.btn-kbd {
  display: inline-flex;
  opacity: 0.85;
}

.btn-primary {
  background: var(--player);
  border-color: #d93a1d;
  box-shadow: 0 3px 0 #b92b12, 0 10px 22px rgba(255, 68, 36, 0.28);
  color: #fff;
}

.btn-primary:hover {
  background: #ff5b3e;
  border-color: #d93a1d;
}

.btn-primary:active {
  box-shadow: 0 1px 0 #b92b12, 0 6px 14px rgba(255, 68, 36, 0.25);
  transform: translateY(2px);
}

#ui .btn-primary kbd {
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.5);
  color: #fff;
}

.btn-ghost {
  background: rgba(255, 255, 255, 0.72);
}

.btn-wide {
  width: 100%;
  justify-content: flex-start;
}

.btn-wide .btn-kbd {
  margin-left: auto;
}

.btn-small {
  height: 34px;
  padding: 0 12px;
  border-radius: 10px;
  font-size: 13.5px;
}

.btn-quiet {
  color: var(--label);
}

.btn[disabled] {
  cursor: default;
}

/* Course buttons styled like the course signs on the slope: yellow board, checker border, arrow. */
.sign {
  --c: var(--sign-slalom);
  pointer-events: auto;
  padding: 5px;
  border: none;
  border-radius: 7px;
  background: repeating-conic-gradient(var(--c) 0 25%, #fff 0 50%) 0 0 / 12px 12px;
  box-shadow: 0 0 0 1.5px var(--ink), 0 3px 0 rgba(27, 42, 68, 0.3), 0 10px 20px rgba(27, 42, 68, 0.16);
  cursor: pointer;
  transition: transform 0.14s var(--ease-pop), box-shadow 0.14s;
}

.sign:hover {
  transform: translateY(-2px) rotate(-1.2deg);
  box-shadow: 0 0 0 1.5px var(--ink), 0 5px 0 rgba(27, 42, 68, 0.3), 0 14px 24px rgba(27, 42, 68, 0.2);
}

.sign:active {
  transform: translateY(1px);
}

.sign--slalom,
.sign-mini.sign--slalom {
  --c: var(--sign-slalom);
}

.sign--freestyle,
.sign-mini.sign--freestyle {
  --c: var(--sign-freestyle);
}

.sign--treeSlalom,
.sign-mini.sign--treeSlalom {
  --c: var(--sign-tree);
}

.sign-board {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  min-width: 136px;
  padding: 9px 14px 8px;
  border-radius: 3px;
  background: var(--sign-board);
  box-shadow: inset 0 0 0 1.5px var(--ink);
}

.sign-name {
  color: var(--ink);
  font: 800 16px/1.1 var(--font-title);
  letter-spacing: 0.05em;
  white-space: nowrap;
}

.sign-best {
  color: rgba(27, 42, 68, 0.72);
  font: 700 11px/1.2 var(--font-hud);
  white-space: nowrap;
}

.sign--small {
  display: flex;
  padding: 4px;
  background-size: 10px 10px;
}

.sign--small .sign-board {
  flex: 1;
  justify-content: center;
  min-width: 0;
  padding: 8px 4px 7px;
}

.sign--small .sign-name {
  font-size: 12.5px;
  letter-spacing: 0.02em;
  white-space: normal;
  text-align: center;
  text-wrap: balance;
}

.sign-mini {
  --c: var(--sign-slalom);
  display: inline-block;
  padding: 3px;
  border-radius: 4px;
  background: repeating-conic-gradient(var(--c) 0 25%, #fff 0 50%) 0 0 / 8px 8px;
  box-shadow: 0 0 0 1.5px var(--ink);
}

.sign-mini-board {
  display: block;
  padding: 3px 8px;
  border-radius: 2px;
  background: var(--sign-board);
  box-shadow: inset 0 0 0 1.5px var(--ink);
  color: var(--ink);
  font: 800 12px/1.2 var(--font-title);
  letter-spacing: 0.08em;
  white-space: nowrap;
}

/* ---------------------------------------------------------------- title */

.title-sky {
  position: absolute;
  inset: 0 0 auto 0;
  height: 48%;
  /* A soft snow glow behind the logo quiets the props the attract camera passes behind it. */
  background:
    radial-gradient(closest-side at 50% 34%, rgba(244, 247, 252, 0.8), rgba(244, 247, 252, 0.55) 55%, rgba(244, 247, 252, 0)),
    linear-gradient(to bottom, rgba(244, 247, 252, 0.72), rgba(244, 247, 252, 0.3) 55%, rgba(244, 247, 252, 0));
}

.title-floor {
  position: absolute;
  inset: auto 0 0 0;
  height: 46%;
  background: linear-gradient(to top, rgba(221, 231, 243, 0.9), rgba(221, 231, 243, 0.45) 55%, rgba(221, 231, 243, 0));
}

.title-head {
  position: absolute;
  top: 6.5vh;
  left: 50%;
  translate: -50% 0;
  width: 92vw;
  text-align: center;
  animation: head-in 0.7s var(--ease-pop) both;
}

@keyframes head-in {
  from {
    opacity: 0;
    transform: translateY(-18px) scale(0.96);
  }
}

.logo {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  margin: 0;
  font: 800 clamp(64px, 10.5vw, 136px) / 0.95 var(--font-title);
  letter-spacing: -0.04em;
}

.logo-ski,
.logo-free {
  -webkit-text-stroke: 0.1em #fff;
  paint-order: stroke fill;
  /* text-shadow is rasterized once with the glyphs; a CSS filter here would be re-applied every frame over the canvas. */
  text-shadow: 0 0.05em 0 rgba(27, 42, 68, 0.1), 0 0.12em 0.2em rgba(27, 42, 68, 0.2);
}

.logo-ski {
  color: #ff4424;
}

.logo-free {
  color: #1f5fe0;
}

.logo-3d {
  margin: 0.1em 0 0 0.14em;
  padding: 0.06em 0.2em 0.08em;
  border-radius: 0.16em;
  background: #ffc93c;
  border: 0.07em solid #fff;
  box-shadow: 0 0 0 0.025em rgba(27, 42, 68, 0.45), 0 10px 22px rgba(27, 42, 68, 0.22);
  color: var(--ink);
  font-size: 0.4em;
  letter-spacing: 0;
  rotate: 7deg;
}

.logo-tracks {
  display: block;
  width: min(560px, 70vw);
  height: 34px;
  margin: -4px auto 0;
  fill: none;
  stroke: #93acd6;
  stroke-width: 3.2;
  stroke-linecap: round;
  opacity: 0.85;
}

.title-tagline {
  margin: 8px 0 0;
  color: var(--label);
  font: 700 12.5px/1.3 var(--font-hud);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  /* A snow-coloured halo keeps the credit legible where a sign or tower passes behind it. */
  text-shadow: 0 0 2px var(--snow), 0 0 6px var(--snow), 0 0 12px var(--snow);
}

.title-record {
  display: inline-block;
  margin: 10px 0 0;
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid var(--panel-border);
  color: var(--ink);
  font: 700 12.5px/1.2 var(--font-hud);
}

.title-menu {
  left: 50%;
  bottom: 11vh;
  translate: -50% 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 22px 28px 18px;
  animation: card-up 0.55s 0.08s var(--ease-pop) both;
}

@keyframes card-up {
  from {
    opacity: 0;
    transform: translateY(26px);
  }
}

.btn-ski {
  min-width: 280px;
  height: 58px;
  border-radius: 16px;
  font-size: 25px;
  letter-spacing: 0.01em;
}

.title-or {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  color: var(--label);
  font: 700 10.5px/1 var(--font-hud);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.title-or::before,
.title-or::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(27, 42, 68, 0.14);
}

.title-courses {
  display: flex;
  gap: 16px;
  padding: 2px 0 4px;
}

.title-utils {
  display: flex;
  gap: 8px;
}

.title-foot {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--label);
  font: 600 12px/1.2 var(--font-hud);
}

.title-foot > span:first-child:not(.title-version) {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.8);
  box-shadow: 0 0 0 1px rgba(27, 42, 68, 0.1);
}

/* How to play on touch devices, under the Ski! button (screenViews.js buildTitle). */
.title-touch {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  margin: -4px 0 0;
  color: var(--label);
  font: 600 11.5px/1.35 var(--font-hud);
  text-align: center;
}

.title-touch-main {
  color: var(--ink);
  font-size: 12.5px;
  font-weight: 700;
}

.title-touch .dot {
  margin: 0 6px;
  opacity: 0.6;
}

.title-foot .dot {
  margin: 0 10px;
  opacity: 0.6;
}

.title-version {
  position: absolute;
  right: 18px;
  bottom: 6px;
  opacity: 0.7;
}

/* ---------------------------------------------------------------- pause */

.pause-card {
  width: min(468px, 94vw);
  padding: 24px 24px 20px;
}

.menu {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.menu-label {
  margin: 8px 0 0;
  color: var(--label);
  font: 700 10.5px/1 var(--font-hud);
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.menu-courses {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 0 8px;
}

.menu-courses .sign {
  flex: 1 1 0;
  min-width: 0;
}

.menu-row {
  display: flex;
  gap: 8px;
}

.menu-row .btn {
  flex: 1;
}

/* Frame stepping ('t' while paused, §1.2): the menu steps aside to a chip at the bottom edge, and the backdrop stops
   dimming and blurring (it still swallows clicks, so a click on the snow is not queued as an ollie). */
.pause-step {
  display: none;
}

.screen-pause.is-stepping .screen-backdrop {
  background: none;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  animation: none;
}

.screen-pause.is-stepping .pause-card {
  top: auto;
  bottom: max(16px, env(safe-area-inset-bottom));
  translate: -50% 0;
  display: flex;
  align-items: center;
  gap: 14px;
  width: auto;
  padding: 6px 6px 6px 18px;
  border-radius: 999px;
  animation: chip-in 0.22s var(--ease-pop) both;
}

.screen-pause.is-stepping :is(.card-title, .card-sub, .menu > :not([data-action='resume'])) {
  display: none;
}

.screen-pause.is-stepping .pause-step {
  display: flex;
  align-items: center;
  gap: 12px;
  white-space: nowrap;
}

.pause-step-title {
  font: 800 13px/1 var(--font-hud);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.pause-step-hint {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--label);
  font: 600 13px/1 var(--font-hud);
}

.screen-pause.is-stepping .btn-wide {
  width: auto;
  height: 36px;
  border-radius: 999px;
}

@keyframes chip-in {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
}

/* ---------------------------------------------------------------- help */

.help-card {
  width: min(900px, 94vw);
  max-height: 92vh;
  overflow: auto;
  overscroll-behavior: contain;
  padding: 24px 28px 20px;
}

.help-grid {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 8px 30px;
}

.help-section + .help-section {
  margin-top: 14px;
}

.help-h {
  margin: 0 0 8px;
  color: var(--label);
  font: 800 11px/1 var(--font-hud);
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.help-row {
  display: grid;
  grid-template-columns: 104px 1fr;
  align-items: center;
  gap: 12px;
  padding: 5px 0;
  border-bottom: 1px solid rgba(27, 42, 68, 0.07);
}

.help-keys {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 3px;
}

#ui .help-keys kbd {
  font-size: 11.5px;
}

.help-sep {
  color: var(--label);
  font-size: 11px;
}

.help-desc {
  font: 500 13.5px/1.35 var(--font-title);
}

.help-air {
  padding: 12px 14px 10px;
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(57, 208, 255, 0.12), rgba(47, 191, 91, 0.1));
  box-shadow: inset 0 0 0 1px rgba(27, 42, 68, 0.08);
}

.help-air .help-row {
  grid-template-columns: 74px 1fr;
}

.help-note {
  margin: 8px 0 0;
  color: var(--label);
  font: 500 12.5px/1.4 var(--font-title);
}

.help-tips {
  margin: 16px 0 0;
  padding: 0 0 0 18px;
  font: 500 13.5px/1.45 var(--font-title);
}

.help-tips li + li {
  margin-top: 6px;
}

.flag-red,
.flag-blue {
  padding: 0 5px;
  border-radius: 4px;
  color: #fff;
  font-weight: 800;
}

.flag-red {
  background: var(--gate-red);
}

.flag-blue {
  background: var(--gate-blue);
}

.help-system {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid rgba(27, 42, 68, 0.1);
  color: var(--label);
  font: 600 12.5px/1 var(--font-hud);
}

.help-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* ---------------------------------------------------------------- score lists (finish + high scores) */

.scores-list {
  margin: 8px 0 0;
  padding: 0;
  list-style: none;
  font: 500 13px/1.2 var(--font-hud);
  font-variant-numeric: tabular-nums;
}

.scores-row {
  display: grid;
  grid-template-columns: 22px 1fr auto auto;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  border-radius: 7px;
}

.scores-row:nth-child(odd) {
  background: rgba(27, 42, 68, 0.045);
}

.scores-rank {
  color: var(--label);
  font-weight: 700;
  text-align: right;
}

.scores-value {
  font-weight: 700;
}

.scores-meta {
  display: inline-flex;
  gap: 4px;
  align-items: center;
}

.scores-missed {
  color: var(--bad);
  font-size: 11.5px;
  font-weight: 700;
}

.scores-date {
  color: var(--label);
  font-size: 11.5px;
}

.scores-row.is-you {
  background: rgba(255, 201, 60, 0.42);
  box-shadow: inset 0 0 0 1.5px rgba(230, 150, 0, 0.55);
}

.scores-row.is-out {
  margin-top: 6px;
}

.scores-you {
  color: #d9361a;
  font-weight: 800;
  white-space: nowrap;
}

.tag-turbo {
  display: inline-grid;
  place-items: center;
  width: 16px;
  height: 16px;
  border-radius: 4px;
  background: var(--accent);
  box-shadow: inset 0 0 0 1px rgba(27, 42, 68, 0.4);
  color: var(--ink);
  font: 900 10px/1 var(--font-hud);
}

.tag-turbo.tag-big {
  width: 22px;
  height: 22px;
  margin-left: 8px;
  font-size: 13px;
  vertical-align: middle;
}

.scores-card {
  width: min(900px, 94vw);
  max-height: 92vh;
  overflow: auto;
  overscroll-behavior: contain;
  padding: 24px 28px 20px;
}

.scores-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

.scores-kind {
  margin: 10px 0 0;
  color: var(--label);
  font: 600 11px/1 var(--font-hud);
}

.scores-empty {
  margin: 14px 0 0;
  padding: 18px 12px;
  border-radius: 12px;
  background: rgba(27, 42, 68, 0.04);
  color: var(--label);
  font: 500 13px/1.45 var(--font-title);
  text-align: center;
}

.scores-foot {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px 18px;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid rgba(27, 42, 68, 0.1);
  font: 600 13px/1.2 var(--font-hud);
  color: var(--label);
}

.scores-foot b {
  color: var(--ink);
}

.scores-legend {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

/* ---------------------------------------------------------------- finish panel (non-blocking, right side) */

/* The run goes on under the panel: only its buttons take pointer input (screenViews.js buildFinish). */
.finish-card {
  pointer-events: none;
  right: 16px;
  top: 214px;
  width: 304px;
  padding: 14px 16px 12px;
  border-radius: 16px;
  animation: slide-in 0.4s var(--ease-pop) both;
}

.finish-card .btn {
  pointer-events: auto;
}

@keyframes slide-in {
  from {
    opacity: 0;
    transform: translateX(40px);
  }
}

.finish-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 4px 0;
}

.finish-label {
  color: var(--good);
  font: 800 12px/1 var(--font-hud);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.finish-result {
  margin: 10px 0 0;
  font: 800 38px/1 var(--font-hud);
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

.finish-detail {
  margin-top: 5px;
  color: var(--label);
  font: 600 12px/1.3 var(--font-hud);
}

.finish-list-title {
  margin: 12px 0 0;
  color: var(--label);
  font: 700 10.5px/1 var(--font-hud);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.finish-card .scores-list {
  font-size: 12.5px;
}

.finish-card .scores-row {
  padding: 3.5px 8px;
}

.finish-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.finish-actions .btn-primary {
  flex: 1;
}

.finish-timer {
  height: 3px;
  margin-top: 10px;
  border-radius: 3px;
  background: rgba(27, 42, 68, 0.08);
  overflow: hidden;
}

.finish-timer-bar {
  display: block;
  height: 100%;
  background: var(--ink);
  opacity: 0.3;
  transform-origin: 0 50%;
}

/* ---------------------------------------------------------------- game over */

.gameover-shade {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 70% 60% at 50% 38%, rgba(94, 15, 28, 0) 45%, rgba(94, 15, 28, 0.28) 100%);
  animation: fade-in 0.8s ease-out both;
}

.gameover-card {
  left: 50%;
  bottom: 6vh;
  translate: -50% 0;
  width: min(660px, 94vw);
  padding: 18px 26px 16px;
  text-align: center;
  animation: card-up 0.5s var(--ease-pop) both;
}

.gameover-kicker {
  color: var(--bad);
  font: 800 12px/1 var(--font-hud);
  letter-spacing: 0.34em;
}

.gameover-title {
  margin: 8px 0 0;
  font: 800 29px/1.12 var(--font-title);
  letter-spacing: -0.01em;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 16px 0 16px;
}

.stat {
  position: relative;
  padding: 10px 8px 9px;
  border-radius: 12px;
  background: rgba(27, 42, 68, 0.05);
  box-shadow: inset 0 0 0 1px rgba(27, 42, 68, 0.06);
}

.stat-label {
  color: var(--label);
  font: 700 10.5px/1 var(--font-hud);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.stat-value {
  margin-top: 6px;
  font: 800 21px/1 var(--font-hud);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* A new longest run: the cell turns gold and gets a sticker on its top-right corner. */
.stat.is-record {
  background: rgba(255, 201, 60, 0.22);
  box-shadow: inset 0 0 0 1.5px rgba(214, 150, 0, 0.55);
}

.stat-badge {
  position: absolute;
  top: -10px;
  right: -8px;
  padding: 3px 8px 2px;
  white-space: nowrap;
  border-radius: 999px;
  background: var(--accent);
  box-shadow: 0 0 0 1.5px var(--ink), 0 3px 8px rgba(27, 42, 68, 0.18);
  color: var(--ink);
  font: 800 10.5px/1.1 var(--font-title);
  letter-spacing: 0.04em;
  text-transform: none;
  rotate: 6deg;
  animation: badge-in 0.4s 0.3s var(--ease-pop) both;
}

.gameover-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
}

.btn-again {
  position: relative;
  overflow: hidden;
  min-width: 200px;
  height: 48px;
  font-size: 18px;
}

.btn-again::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 3px;
  background: rgba(255, 255, 255, 0.85);
  transform-origin: 0 50%;
  transform: scaleX(var(--lock, 0));
}

.btn-again[disabled] {
  opacity: 0.72;
}

.is-ready .btn-again::after {
  opacity: 0;
  transition: opacity 0.3s;
}

.gameover-actions .btn-ghost {
  height: 48px;
}

.gameover-hint {
  margin: 10px 0 0;
  color: var(--label);
  font: 600 12px/1.2 var(--font-hud);
}

/* ---------------------------------------------------------------- small and short screens */

@media (max-width: 760px) {
  /* Portrait phones frame the skier just under the HUD, so the band below the skier is the look-ahead and the finger's
     steering zone: one toast at a time sits low, above the tuck strip (bottom 10 %) and the home indicator. */
  .toasts,
  .hud.has-yeti .toasts {
    top: auto;
    bottom: calc(14vh + env(safe-area-inset-bottom, 0px));
  }
  .toast:nth-child(n + 2) {
    display: none;
  }
  .toast-sub {
    font-size: 17px;
  }
  .title-tagline {
    font-size: 10.5px;
    letter-spacing: 0.08em;
  }
  .pause-card {
    padding: 20px 16px 16px;
  }
  /* A compact HUD: 44 px buttons and a 2 × 2 panel (label over value) keep the uphill band above the skier, where the
     yeti comes from, mostly clear. */
  .hud-tl {
    top: 12px;
    left: 12px;
    gap: 6px;
  }
  .hud.is-touch .hud-btn {
    width: 44px;
    height: 44px;
    border-radius: 14px;
  }
  #ui .hud.is-touch .hud-btn .icon {
    width: 22px;
    height: 22px;
  }
  .hud-tr {
    top: 12px;
    right: 12px;
    gap: 6px;
  }
  .hud-panel {
    display: grid;
    grid-template-columns: auto auto;
    gap: 3px 16px;
    min-width: 0;
    padding: 6px 12px 7px;
    border-radius: 12px;
    line-height: 1.2;
  }
  .hud-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
  }
  .hud-label {
    font-size: 9.5px;
    letter-spacing: 0.1em;
  }
  .hud-value {
    font-size: 14.5px;
    transform-origin: 0 60%;
  }
  .hud-unit {
    font-size: 11px;
  }
  .hud-mode {
    padding: 3px 10px 3px 8px;
    font-size: 11px;
  }
  .toast-title {
    font-size: 28px;
  }
  .title-menu {
    width: 94vw;
    padding: 18px 14px 14px;
  }
  .title-courses {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    width: 100%;
    gap: 8px;
  }
  .title-courses .sign {
    display: flex;
  }
  .sign-board {
    flex: 1;
    justify-content: center;
    min-width: 0;
    padding: 8px 4px 7px;
  }
  #ui .sign-name {
    font-size: 12px;
    letter-spacing: 0.02em;
    white-space: normal;
    text-align: center;
    text-wrap: balance;
  }
  .title-utils {
    flex-wrap: wrap;
    justify-content: center;
  }
  .title-foot {
    display: none;
  }
  .help-grid,
  .scores-grid {
    grid-template-columns: 1fr;
  }
  .stats {
    grid-template-columns: repeat(2, 1fr);
  }
  /* Portrait phones: a compact card in the top-left corner, under the pause buttons, beside the skier rather than in
     the look-ahead and the finger's steering zone below it (a finger kept above the skier means stop, so a stray tap
     rarely lands here). Leader and your own row only; "Retry" without the course name. */
  .finish-card {
    top: 64px;
    left: 12px;
    right: auto;
    width: min(166px, calc(50vw - 30px));
    padding: 10px 10px 9px;
    border-radius: 14px;
    animation-name: slide-in-left;
  }
  .finish-head {
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    padding: 0;
  }
  .finish-result {
    margin-top: 7px;
    font-size: 28px;
  }
  .finish-detail {
    font-size: 11px;
  }
  .finish-list-title {
    display: none;
  }
  .finish-card .scores-list {
    margin-top: 8px;
    font-size: 12px;
  }
  .finish-card .scores-row {
    grid-template-columns: 16px 1fr auto;
    gap: 6px;
    padding: 3px 6px;
  }
  /* The highlighted row and the head's rank label say it; the dates and "◀ that's you" do not fit. */
  .finish-card :is(.scores-date, .scores-you) {
    display: none;
  }
  .finish-card .scores-row:not(:first-child):not(.is-you) {
    display: none;
  }
  .finish-actions {
    gap: 6px;
    margin-top: 9px;
  }
  .finish-actions .btn {
    padding: 0 10px;
  }
  .finish-retry-course {
    display: none;
  }
}

@keyframes slide-in-left {
  from {
    opacity: 0;
    transform: translateX(-40px);
  }
}

/* Touch devices: no keyboard, so no key caps on buttons, and finger-sized finish buttons. */
@media (pointer: coarse) {
  #ui .btn-kbd {
    display: none;
  }
  .finish-actions .btn {
    height: 44px;
  }
}

@media (max-height: 640px) {
  .title-head {
    top: 3vh;
  }
  .logo {
    font-size: clamp(48px, 8vw, 88px);
  }
  .title-menu {
    bottom: 60px;
    gap: 10px;
    padding: 14px 22px 12px;
  }
  .finish-card .scores-row:nth-child(n + 6):not(.is-you) {
    display: none;
  }
}

/* The right-side finish panel on short wide screens (portrait phones keep theirs top-left, see max-width: 760px). */
@media (max-height: 640px) and (min-width: 761px) {
  .finish-card {
    top: 170px;
  }
}

/* Landscape phones: everything compacts so the cards never leave the screen and the game over leaves the yeti in view. */
@media (max-height: 460px) {
  .title-head {
    top: 8px;
  }
  .logo {
    font-size: 46px;
  }
  .logo-tracks,
  .title-record,
  .title-foot {
    display: none;
  }
  .title-tagline {
    margin-top: 4px;
    font-size: 10px;
  }
  .title-menu {
    bottom: 10px;
    gap: 8px;
    padding: 12px 18px 12px;
  }
  .btn-ski {
    height: 44px;
    font-size: 20px;
  }
  .sign-board {
    padding: 6px 12px 5px;
  }
  .sign-name {
    font-size: 14px;
  }
  .btn {
    height: 36px;
  }
  .pause-card {
    max-height: calc(100vh - 20px);
    overflow: auto;
    overscroll-behavior: contain;
    padding: 14px 20px 14px;
  }
  .pause-card .card-title {
    font-size: 24px;
  }
  .pause-card .card-sub {
    margin-bottom: 10px;
  }
  .menu {
    gap: 6px;
  }
  .gameover-card {
    bottom: 8px;
    padding: 12px 20px 12px;
  }
  .gameover-title {
    font-size: 21px;
  }
  .stats {
    margin: 10px 0;
  }
  .stat {
    padding: 7px 6px 6px;
  }
  .stat-value {
    font-size: 17px;
  }
  .btn-again,
  .gameover-actions .btn-ghost {
    height: 40px;
  }
  .gameover-hint {
    display: none;
  }
  .finish-card .scores-row:not(:first-child):not(.is-you) {
    display: none;
  }
  .toasts,
  .hud.has-yeti .toasts {
    top: 3%;
  }
  .toast-title {
    font-size: 28px;
  }
  /* Only the newest toast: the strip above the skier holds one. */
  .toast:nth-child(n + 2) {
    display: none;
  }
}

@media (max-height: 460px) and (min-width: 761px) {
  .finish-card {
    top: auto;
    bottom: 10px;
  }
}

/* Reduced motion: entries appear in place; nothing bobs, pulses or throbs. */
@media (prefers-reduced-motion: reduce) {
  #ui *,
  #ui *::before,
  #ui *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
